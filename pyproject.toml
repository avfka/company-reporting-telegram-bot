[project]
name = "company-reporting-telegram-bot"
version = "0.1.0"
description = "Secure Telegram bot for read-only PostgreSQL reports"
requires-python = ">=3.12"
dependencies = [
    "click==8.4.2",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.13",
    "SQLAlchemy==2.0.52",
    "uvicorn==0.39.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel.scripts]
build = "python scripts/set_webhook.py"
